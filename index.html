<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hay Day: FAM Farm Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --grass: #5d9e3f; --dirt: #8d6e63; --gold: #f1c40f; --white: #ffffff; --wood: #8B4513; }
        body { background: var(--grass); color: white; font-family: 'Arial', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .header { width: 95%; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; border: 2px solid var(--gold); box-sizing: border-box; position: sticky; top: 0; z-index: 10; }
        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 20px; padding-bottom: 220px; }
        .building-slot { background: var(--wood); border: 4px solid #6c3a2a; border-radius: 18px; padding: 15px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .animal-slot { background: var(--dirt); border: 4px solid #5d4037; border-radius: 18px; padding: 15px; text-align: center; position: relative; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .product-badge { position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; border: 2px solid white; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .shop-menu { position: fixed; bottom: 0; width: 100%; background: #3e2723; border-radius: 25px 25px 0 0; padding: 15px; border-top: 4px solid var(--gold); z-index: 10; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: var(--gold); font-weight: bold;">💰 <span id="balance">100</span> FAM</div>
        <div id="warehouse-status">🥚:0 | 🧶:0 | 🥩:0</div>
    </div>

    <div class="farm-grid" id="farm-grid"></div>

    <div class="shop-menu">
        <button class="btn" style="background: #2ecc71; color: white;" onclick="buyAnimal('chicken', 10)">+ 🐔 Tovuq (10)</button>
        <button class="btn" style="background: #3498db; color: white;" onclick="buyAnimal('sheep', 150)">+ 🐑 Qo'y (150)</button>
        <button class="btn" style="background: #e67e22; color: white;" onclick="buyAnimal('cow', 500)">+ 🐄 Mol (500)</button>
        <button class="btn" style="background: var(--gold);" onclick="sellAll()">SOTISH 💰</button>
        <button class="btn" style="background: #e74c3c; color: white;" onclick="saveGame()">💾 SAQLASH</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let farmData = { balance: 100, animals: [], warehouse: { eggs: 0, wool: 0, meat: 0 }, buildings: { chicken_coop: 0, sheep_barn: 0, cow_shed: 0, house: 1 } };

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('b')) farmData.balance = parseInt(params.get('b'));
            if(params.get('i')) {
                params.get('i').split(',').forEach(p => {
                    if(!p.includes(':')) return;
                    let [t, c] = p.split(':');
                    let type = (t==='C')?'chicken':(t==='S')?'sheep':'cow';
                    for(let i=0; i<parseInt(c); i++) farmData.animals.push({type: type, ready: false, last: Date.now()});
                });
            }
            if(params.get('w')) {
                params.get('w').split(',').forEach(p => {
                    if(!p.includes(':')) return;
                    let [t, c] = p.split(':');
                    if(t==='E') farmData.warehouse.eggs = parseInt(c);
                    if(t==='W') farmData.warehouse.wool = parseInt(c);
                    if(t==='M') farmData.warehouse.meat = parseInt(c);
                });
            }
            updateUI(); renderFarm();
        };

        function buyAnimal(type, price) {
            if (farmData.balance >= price) {
                farmData.balance -= price;
                farmData.animals.push({ type: type, ready: false, last: Date.now() });
                updateUI(); renderFarm(); tg.HapticFeedback.impactOccurred('medium');
            } else { tg.showAlert("Mablag' yetarli emas!"); }
        }

        function renderFarm() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '<div class="building-slot"><div style="font-size:45px">🏠</div><b>UY</b></div>';
            if(farmData.animals.some(a=>a.type==='chicken')) grid.innerHTML += '<div class="building-slot">🐔<b>TOVUQXONA</b></div>';
            if(farmData.animals.some(a=>a.type==='sheep')) grid.innerHTML += '<div class="building-slot">🐑<b>QO\'YXONA</b></div>';
            if(farmData.animals.some(a=>a.type==='cow')) grid.innerHTML += '<div class="building-slot">🐄<b>MOLXONA</b></div>';
            
            farmData.animals.forEach((a, i) => {
                const div = document.createElement('div');
                div.className = 'animal-slot';
                let icon = a.type==='chicken'?'🐔':a.type==='sheep'?'🐑':'🐄';
                div.innerHTML = `<div style="font-size:45px">${icon}</div><div id="badge-${i}" class="product-badge" style="display:${a.ready?'block':'none'}">!</div>`;
                div.onclick = () => collect(i);
                grid.appendChild(div);
            });
        }

        setInterval(() => {
            farmData.animals.forEach((a, i) => {
                let cooldown = a.type==='chicken'?15000:a.type==='sheep'?45000:90000;
                if(!a.ready && Date.now()-a.last > cooldown) {
                    a.ready = true;
                    let b = document.getElementById(`badge-${i}`);
                    if(b) b.style.display = 'block';
                }
            });
        }, 1000);

        function collect(i) {
            let a = farmData.animals[i];
            if(a.ready) {
                if(a.type==='chicken') farmData.warehouse.eggs++;
                else if(a.type==='sheep') farmData.warehouse.wool++;
                else farmData.warehouse.meat++;
                a.ready = false; a.last = Date.now();
                document.getElementById(`badge-${i}`).style.display = 'none';
                updateUI(); tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function sellAll() {
            let profit = (farmData.warehouse.eggs*2) + (farmData.warehouse.wool*40) + (farmData.warehouse.meat*100);
            if(profit > 0) {
                farmData.balance += profit;
                farmData.warehouse = {eggs:0, wool:0, meat:0};
                updateUI(); tg.showAlert(`Sotildi: +${profit} FAM 💰`);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(farmData.balance);
            document.getElementById('warehouse-status').innerText = `🥚:${farmData.warehouse.eggs}|🧶:${farmData.warehouse.wool}|🥩:${farmData.warehouse.meat}`;
        }

        function saveGame() {
            let c = farmData.animals.filter(a=>a.type==='chicken').length;
            let s = farmData.animals.filter(a=>a.type==='sheep').length;
            let w = farmData.animals.filter(a=>a.type==='cow').length;
            let inv = `C:${c},S:${s},W:${w}`;
            let ware = `E:${farmData.warehouse.eggs},W:${farmData.warehouse.wool},M:${farmData.warehouse.meat}`;
            tg.sendData(JSON.stringify({balance: farmData.balance, inventory: inv, warehouse: ware}));
            tg.close();
        }
    </script>
</body>
</html>
