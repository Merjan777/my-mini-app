<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haqiqiy Oltin Ferma</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f1c40f; --green: #2ecc71; --brown: #8d6e63; --white: #ecf0f1; }
        body { background: #2d5a27; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--gold); }
        .stat-item h3 { margin: 0; font-size: 12px; opacity: 0.8; }
        .stat-item p { margin: 5px 0 0; font-size: 18px; font-weight: bold; color: var(--gold); }
        .animal-card { background: #3e2723; border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--gold); }
        .info h4 { margin: 0; font-size: 18px; }
        .info p { margin: 3px 0; font-size: 12px; color: #ddd; }
        .controls { display: flex; flex-direction: column; gap: 5px; }
        .btn { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-buy { background: var(--green); color: white; }
        .btn-sell { background: var(--gold); color: black; }
        .storage { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">🚜 MENING FERMAM</h2>
    
    <div class="stats">
        <div class="stat-item"><h3>💰 BALANS</h3><p id="balance">100</p></div>
        <div class="stat-item"><h3>📦 MAHSULOT</h3><p id="prod-total">0</p></div>
    </div>

    <div class="animal-card">
        <div class="info">
            <h4>🐔 Tovuqlar: <span id="count-c">0</span></h4>
            <p>Narxi: 10 FAM | Tuxum: 1 FAM</p>
        </div>
        <div class="controls">
            <button class="btn btn-buy" onclick="buy('c', 10)">+1 OLISH</button>
            <button class="btn btn-sell" onclick="sell('egg', 1)">TUXUM SOTISH</button>
        </div>
    </div>

    <div class="animal-card" style="border-left-color: var(--white);">
        <div class="info">
            <h4>🐑 Qo'ylar: <span id="count-s">0</span></h4>
            <p>Narxi: 150 FAM | Jun: 25 FAM</p>
        </div>
        <div class="controls">
            <button class="btn btn-buy" onclick="buy('s', 150)">+1 OLISH</button>
            <button class="btn btn-sell" onclick="sell('wool', 25)">JUN SOTISH</button>
        </div>
    </div>

    <div class="animal-card" style="border-left-color: #795548;">
        <div class="info">
            <h4>🐄 Mollar: <span id="count-m">0</span></h4>
            <p>Narxi: 500 FAM | Sut: 80 FAM</p>
        </div>
        <div class="controls">
            <button class="btn btn-buy" onclick="buy('m', 500)">+1 OLISH</button>
            <button class="btn btn-sell" onclick="sell('milk', 80)">SUT SOTISH</button>
        </div>
    </div>

    <div class="storage">
        📦 Ombor: <span id="inv-display">Tuxum: 0, Jun: 0, Sut: 0</span>
    </div>

    <button onclick="save()" style="width:100%; margin-top:20px; padding:15px; border-radius:12px; background: #e74c3c; color:white; border:none; font-weight:bold;">💾 SAQLASH VA CHIQISH</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let farm = {
            balance: 100,
            c: 0, s: 0, m: 0,
            egg: 0, wool: 0, milk: 0
        };

        // Mahsulot yig'ish (har 5 soniyada)
        setInterval(() => {
            farm.egg += farm.c;
            farm.wool += farm.s;
            farm.milk += farm.m;
            updateUI();
        }, 5000);

        function buy(type, price) {
            if (farm.balance >= price) {
                farm.balance -= price;
                farm[type]++;
                updateUI();
                tg.HapticFeedback.impactOccurred('medium');
            } else { tg.showAlert("Mablag' yetarli emas!"); }
        }

        function sell(prod, price) {
            let qty = farm[prod];
            if (qty > 0) {
                let gain = qty * price;
                farm.balance += gain;
                farm[prod] = 0;
                updateUI();
                tg.showAlert(`Sotildi! +${gain} FAM`);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = farm.balance;
            document.getElementById('count-c').innerText = farm.c;
            document.getElementById('count-s').innerText = farm.s;
            document.getElementById('count-m').innerText = farm.m;
            document.getElementById('inv-display').innerText = `🥚:${farm.egg}, 🧶:${farm.wool}, 🥛:${farm.milk}`;
        }

        function save() {
            tg.sendData(JSON.stringify({
                action: "update_farm",
                balance: farm.balance,
                inventory: `C:${farm.c},S:${farm.s},M:${farm.m}`
            }));
        }
    </script>
</body>
</html>
