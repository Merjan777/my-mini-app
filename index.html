<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Farm World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --grass-dark: #388e3c;
            --grass-light: #66bb6a;
            --wood: #5d4037;
            --sky: #29b6f6;
            --btn-blue: #3498db;
        }
        body {
            margin: 0; padding: 10px;
            background-color: var(--grass-dark);
            background-image: radial-gradient(var(--grass-light) 15%, transparent 16%),
                              radial-gradient(var(--grass-light) 15%, transparent 16%);
            background-size: 20px 20px;
            font-family: 'Segoe UI', sans-serif;
            color: white; user-select: none;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* HEADER */
        .header {
            background: #4e342e; border: 3px solid #3e2723;
            border-radius: 12px; padding: 10px;
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .coin { color: #f1c40f; font-weight: bold; font-size: 16px; }
        .food { color: #e67e22; font-weight: bold; font-size: 14px; }

        /* XARITA (Bosh Ekran) */
        .map-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-top: 20px;
        }
        .building {
            background: linear-gradient(to bottom, #8d6e63, #5d4037);
            border-radius: 15px; padding: 20px 10px; text-align: center;
            border: 4px solid #3e2723; box-shadow: 0 6px 0 #2d1e18;
            cursor: pointer; position: relative;
            transition: transform 0.1s;
        }
        .building:active { transform: translateY(4px); box-shadow: 0 2px 0 #2d1e18; }
        .b-icon { font-size: 40px; display: block; margin-bottom: 5px; }
        .b-name { font-weight: bold; font-size: 14px; color: #ffe0b2; }
        .b-count { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; border: 2px solid white; }

        /* ICHKI KO'RINISH (Hayvonlar panjarasi) */
        #interior-view { display: none; }
        .back-btn {
            background: #e74c3c; color: white; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: bold; margin-bottom: 15px;
            cursor: pointer; border-bottom: 3px solid #c0392b;
        }
        
        /* HAYVON KARTASI */
        .farm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card {
            background: #fff8e1; border-radius: 10px; padding: 5px;
            text-align: center; border-bottom: 4px solid #d4a76a;
            position: relative;
        }
        .card.hungry { filter: grayscale(100%); opacity: 0.7; }
        .progress-container { width: 100%; height: 5px; background: #ddd; margin-top: 5px; border-radius: 3px; }
        .progress-fill { height: 100%; width: 0%; background: #2ecc71; }

        /* PASTKI MENYU */
        .controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #3e2723; padding: 10px;
            display: flex; justify-content: space-around;
            border-top: 4px solid #8d6e63; z-index: 1000;
        }
        .ctrl-btn {
            background: var(--btn-blue); color: white; border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: bold;
            border-bottom: 3px solid #2980b9;
        }
        .ctrl-save { background: #27ae60; border-bottom-color: #219150; }

        /* SHOP MODAL (Soddalashtirilgan) */
        #shop-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 85%;
            background: #fff3e0; border: 4px solid #5d4037; border-radius: 15px;
            padding: 20px; z-index: 2000; color: #3e2723;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }
        .shop-row button {
            width: 100%; margin-bottom: 8px; padding: 10px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            color: white;
        }
        .btn-buy-anim { background: #27ae60; border-bottom: 3px solid #1e8449; }
        .btn-buy-food { background: #e67e22; border-bottom: 3px solid #d35400; }
        .close-shop { background: #c0392b; margin-top: 10px; }

    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="coin">💰 <span id="balance">0</span></div>
            <div class="food">🌾 Yem: <span id="food">0</span></div>
        </div>
        <div style="font-size: 20px;" onclick="saveGame()">💾</div>
    </div>

    <div id="map-view">
        <h3 style="text-align: center; margin: 0;">Fermangiz Xaritasi 🗺</h3>
        <div class="map-grid">
            <div class="building" onclick="openBuilding('chicken')">
                <span class="b-icon">🛖</span>
                <div class="b-name">TOVUQXONA</div>
                <div class="b-count" id="count-chicken">0</div>
            </div>
            <div class="building" onclick="openBuilding('sheep')">
                <span class="b-icon">🏚</span>
                <div class="b-name">QO'YXONA</div>
                <div class="b-count" id="count-sheep">0</div>
            </div>
            <div class="building" onclick="openBuilding('cow')">
                <span class="b-icon">🏠</span>
                <div class="b-name">MOLXONA</div>
                <div class="b-count" id="count-cow">0</div>
            </div>
            <div class="building" onclick="openShop()">
                <span class="b-icon">🏪</span>
                <div class="b-name">BOZOR & YEM</div>
            </div>
        </div>
    </div>

    <div id="interior-view">
        <button class="back-btn" onclick="showMap()">⬅️ Xaritaga qaytish</button>
        <h3 id="room-title" style="margin-top: 0; text-align: center;">Xona</h3>
        <div class="farm-grid" id="farm-grid"></div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="openShop()">🛒 Do'kon</button>
        <button class="ctrl-btn" onclick="sellAll()">💰 Sotish</button>
    </div>

    <div id="shop-modal">
        <h3 style="text-align: center; margin-top: 0;">Fermer Do'koni</h3>
        <div class="shop-row">
            <button class="btn-buy-anim" onclick="buyAnimal('chicken', 10)">🐔 Tovuq (10 FAM)</button>
            <button class="btn-buy-anim" onclick="buyAnimal('sheep', 150)">🐑 Qo'y (150 FAM)</button>
            <button class="btn-buy-anim" onclick="buyAnimal('cow', 500)">🐄 Sigir (500 FAM)</button>
            <hr>
            <button class="btn-buy-food" onclick="buyFood()">🌾 5 ta YEM (2 FAM)</button>
            <button class="shop-row close-shop" onclick="closeShop()">Yopish ❌</button>
        </div>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
const urlParams = new URLSearchParams(window.location.search);

// SOZLAMALAR
const CONFIG = {
    chicken: { time: 3, food: 1, name: "Tovuqxona" },
    sheep:   { time: 5, food: 2, name: "Qo'yxona" },
    cow:     { time: 8, food: 3, name: "Molxona" }
};

let game = {
    balance: parseInt(urlParams.get('b')) || 10,
    food: parseInt(urlParams.get('f')) || 5,
    inventory: parseInventory(urlParams.get('i')),
    warehouse: parseWarehouse(urlParams.get('w'))
};

let animalTimers = [];
let currentView = 'map'; // Hozir qayerda ekanligi (map yoki building)
let currentBuilding = null; // Qaysi binoda ekanligi

function parseInventory(str) {
    if (!str) return {};
    let inv = {};
    str.split(',').forEach(item => {
        let [type, count] = item.split(':');
        if (type && count) inv[type] = parseInt(count);
    });
    return inv;
}
function parseWarehouse(str) {
    if (!str) return {eggs: 0, wool: 0, meat: 0};
    let wh = {eggs: 0, wool: 0, meat: 0};
    str.split(',').forEach(p => { if(p.includes(':')) { let [k,v]=p.split(':'); wh[getFullKey(k)]=parseInt(v); }});
    return wh;
}
function getFullKey(k) { if(k=='E')return 'eggs'; if(k=='W')return 'wool'; if(k=='M')return 'meat'; return k; }

// --- UI YANGILASH ---
function updateUI() {
    document.getElementById("balance").innerText = Math.floor(game.balance);
    document.getElementById("food").innerText = game.food;

    // Xaritadagi sonlarni yangilash
    document.getElementById("count-chicken").innerText = game.inventory.chicken || 0;
    document.getElementById("count-sheep").innerText = game.inventory.sheep || 0;
    document.getElementById("count-cow").innerText = game.inventory.cow || 0;
}

// --- XARITA VA NAVIGATSIYA ---
function showMap() {
    currentView = 'map';
    currentBuilding = null;
    document.getElementById("map-view").style.display = "block";
    document.getElementById("interior-view").style.display = "none";
    updateUI();
}

function openBuilding(type) {
    currentView = 'building';
    currentBuilding = type;
    document.getElementById("map-view").style.display = "none";
    document.getElementById("interior-view").style.display = "block";
    document.getElementById("room-title").innerText = CONFIG[type].name;
    
    renderInterior(type);
}

function renderInterior(type) {
    const grid = document.getElementById("farm-grid");
    grid.innerHTML = "";
    animalTimers = []; // Eski taymerlarni tozalash

    const count = game.inventory[type] || 0;
    if (count === 0) {
        grid.innerHTML = "<p style='grid-column: span 3; color: gray;'>Bu yer bo'm-bo'sh...</p>";
        return;
    }

    for (let i = 0; i < count; i++) {
        createAnimalCard(type, i, grid);
    }
}

function createAnimalCard(type, index, container) {
    const card = document.createElement("div");
    card.className = "card";
    const barId = `bar-${index}`;
    
    card.innerHTML = `
        <div style="font-size:30px">${type=='chicken'?'🐔':type=='sheep'?'🐑':'🐄'}</div>
        <div class="progress-container"><div class="progress-fill" id="${barId}"></div></div>
    `;
    container.appendChild(card);

    animalTimers.push({
        id: barId,
        type: type,
        progress: Math.random() * 80,
        speed: 100 / (CONFIG[type].time * 10)
    });
}

// --- GAME LOOP ---
setInterval(() => {
    // Agar xaritada bo'lsak, taymerlarni chizish shart emas, lekin orqada ishlashi kerak
    // Hozir soddalik uchun faqat bino ichida bo'lganda animatsiya qilamiz
    if (currentView !== 'building') return;

    animalTimers.forEach(animal => {
        if (game.food > 0) {
            animal.progress += animal.speed;
        }

        if (animal.progress >= 100) {
            let cost = CONFIG[animal.type].food;
            if (game.food >= cost) {
                game.food -= cost;
                animal.progress = 0;
                produceItem(animal.type);
                updateUI();
            } else {
                animal.progress = 99; // Yem yetmasa to'xtaydi
            }
        }

        const bar = document.getElementById(animal.id);
        if(bar) bar.style.width = animal.progress + "%";
    });
}, 100);

function produceItem(type) {
    if (type === 'chicken') game.warehouse.eggs++;
    if (type === 'sheep') game.warehouse.wool++;
    if (type === 'cow') game.warehouse.meat++;
}

// --- DO'KON VA ACTIONS ---
function openShop() { document.getElementById("shop-modal").style.display = "block"; }
function closeShop() { document.getElementById("shop-modal").style.display = "none"; }

function buyAnimal(type, price) {
    if (game.balance >= price) {
        game.balance -= price;
        game.inventory[type] = (game.inventory[type] || 0) + 1;
        updateUI();
        tg.HapticFeedback.impactOccurred('medium');
        
        // Agar o'sha binoda bo'lsak, yangilaymiz
        if (currentView === 'building' && currentBuilding === type) {
            renderInterior(type);
        } else {
            tg.showAlert(`Sotib olindi! ${CONFIG[type].name}ga qarang.`);
        }
    } else {
        tg.showAlert("Pul yetmaydi!");
    }
}

function buyFood() {
    if (game.balance >= 2) {
        game.balance -= 2;
        game.food += 5;
        updateUI();
        tg.HapticFeedback.impactOccurred('light');
    } else tg.showAlert("Pul yetmaydi!");
}

function sellAll() {
    let income = (game.warehouse.eggs * 2) + (game.warehouse.wool * 30) + (game.warehouse.meat * 100);
    if (income > 0) {
        game.balance += income;
        game.warehouse = {eggs: 0, wool: 0, meat: 0};
        updateUI();
        tg.showAlert(`Sotildi! +${income} FAM`);
    } else tg.showAlert("Ombor bo'sh!");
}

function saveGame() {
    let invStr = Object.entries(game.inventory).map(([k,v]) => `${k}:${v}`).join(',');
    let warStr = `E:${game.warehouse.eggs},W:${game.warehouse.wool},M:${game.warehouse.meat}`;
    tg.sendData(JSON.stringify({
        balance: game.balance, inventory: invStr, warehouse: warStr, food: game.food
    }));
}

// Start
updateUI();
</script>
</body>
</html>
