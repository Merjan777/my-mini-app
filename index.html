<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Farm Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --grass: linear-gradient(135deg, #7cfc00, #32cd32);
            --gold: #f1c40f;
            --wood: #5d4037;
        }
        body {
            margin: 0; padding: 10px;
            background: var(--grass);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white; user-select: none;
            overflow-x: hidden;
        }
        .header {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 10px 15px;
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px;
            position: sticky; top: 0; z-index: 100;
        }
        .coin { font-size: 18px; font-weight: bold; color: var(--gold); }
        .warehouse { font-size: 12px; text-align: right; }
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; padding-bottom: 200px;
        }
        .card {
            background: #fdf5e6; border-radius: 15px;
            padding: 15px 5px; text-align: center;
            border: 3px solid var(--wood);
            box-shadow: 0 4px 0 #3e2723; transition: 0.1s;
        }
        .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #3e2723; }
        .icon { font-size: 35px; margin-bottom: 5px; }
        .shop {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #3e2723; border-radius: 20px 20px 0 0;
            padding: 15px; box-sizing: border-box;
            border-top: 4px solid var(--gold); z-index: 1000;
        }
        .shop-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn {
            border: none; padding: 10px 5px; border-radius: 10px;
            font-weight: bold; font-size: 12px; cursor: pointer;
        }
        .buy { background: #2ecc71; color: white; }
        .sell { background: var(--gold); color: #3e2723; width: 100%; font-size: 16px; }
        .stars { background: #3498db; color: white; width: 100%; margin-bottom: 8px; }
        .save { background: #e67e22; color: white; width: 100%; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="coin">💰 <span id="balance">0</span></div>
        <div class="warehouse" id="warehouse">🥚0 | 🧶0 | 🥩0</div>
    </div>

    <div class="farm-grid" id="farm"></div>

    <div class="shop">
        <div class="shop-row">
            <button class="btn buy" onclick="buyAnimal('chicken', 10)">🐔 10</button>
            <button class="btn buy" onclick="buyAnimal('sheep', 150)">🐑 150</button>
            <button class="btn buy" onclick="buyAnimal('cow', 500)">🐄 500</button>
        </div>
        <button class="btn save" onclick="saveGame()">💾 SAQLASH</button>
        <button class="btn stars" onclick="buyStars()">⭐ 1000 FAM (50 XTR)</button>
        <button class="btn sell" onclick="sellAll()">HOSILNI SOTISH 💰</button>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// URL parametrlardan ma'lumotlarni olish
const urlParams = new URLSearchParams(window.location.search);
let game = {
    balance: parseInt(urlParams.get('b')) || 100,
    inventory: parseInventory(urlParams.get('i')),
    warehouse: parseWarehouse(urlParams.get('w'))
};

function parseInventory(str) {
    if (!str) return {};
    let inv = {};
    str.split(',').forEach(item => {
        let [type, count] = item.split(':');
        if (type && count) inv[type] = parseInt(count);
    });
    return inv;
}

function parseWarehouse(str) {
    if (!str) return {eggs: 0, wool: 0, meat: 0};
    let parts = str.split(',');
    return {
        eggs: parseInt(parts[0].split(':')[1]) || 0,
        wool: parseInt(parts[1].split(':')[1]) || 0,
        meat: parseInt(parts[2].split(':')[1]) || 0
    };
}

function updateUI() {
    document.getElementById("balance").innerText = game.balance;
    document.getElementById("warehouse").innerText = 
        `🥚${game.warehouse.eggs} | 🧶${game.warehouse.wool} | 🥩${game.warehouse.meat}`;
}

function renderFarm() {
    const farm = document.getElementById("farm");
    farm.innerHTML = "";
    for (const type in game.inventory) {
        for (let i = 0; i < game.inventory[type]; i++) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="icon">${type==='chicken'?'🐔':type==='sheep'?'🐑':'🐄'}</div><div style="font-size:10px">YIG'ISH</div>`;
            card.onclick = () => collect(type);
            farm.appendChild(card);
        }
    }
}

function buyAnimal(type, price) {
    if (game.balance >= price) {
        game.balance -= price;
        game.inventory[type] = (game.inventory[type] || 0) + 1;
        updateUI();
        renderFarm();
        tg.HapticFeedback.impactOccurred('medium');
    } else {
        tg.showAlert("Mablag' yetarli emas!");
    }
}

function collect(type) {
    if (type === 'chicken') game.warehouse.eggs++;
    else if (type === 'sheep') game.warehouse.wool++;
    else if (type === 'cow') game.warehouse.meat++;
    updateUI();
    tg.HapticFeedback.notificationOccurred('success');
}

function sellAll() {
    let income = (game.warehouse.eggs * 2) + (game.warehouse.wool * 30) + (game.warehouse.meat * 100);
    if (income > 0) {
        game.balance += income;
        game.warehouse = {eggs: 0, wool: 0, meat: 0};
        updateUI();
        tg.showAlert(`Sotildi! Daromad: ${income} FAM`);
    }
}

function saveGame() {
    let invStr = Object.entries(game.inventory).map(([k,v]) => `${k}:${v}`).join(',');
    let warStr = `E:${game.warehouse.eggs},W:${game.warehouse.wool},M:${game.warehouse.meat}`;
    
    tg.sendData(JSON.stringify({
        balance: game.balance,
        inventory: invStr,
        warehouse: warStr
    }));
    // sendData ishlatilganda ilova yopiladi
}

function buyStars() {
    tg.sendData(JSON.stringify({ action: "stars_purchase" }));
}

updateUI();
renderFarm();
</script>
</body>
</html>
