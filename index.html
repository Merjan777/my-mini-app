<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hay Day Clone: FAM Farm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --grass: #5d9e3f; --dirt: #8d6e63; --gold: #f1c40f; }
        body { background: var(--grass); color: white; font-family: 'Arial', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 95%; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px; display: flex; justify-content: space-between; border: 2px solid var(--gold); }
        .coin-box { color: var(--gold); font-weight: bold; font-size: 18px; }

        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 20px; }
        .animal-slot { background: var(--dirt); border: 3px solid #5d4037; border-radius: 15px; padding: 10px; text-align: center; position: relative; }
        
        .animal-img { width: 60px; height: 60px; margin-bottom: 5px; }
        .product-badge { position: absolute; top: -5px; right: -5px; background: #e74c3c; padding: 5px 10px; border-radius: 50%; font-size: 12px; display: none; }

        .shop-menu { width: 100%; background: #3e2723; border-radius: 20px 20px 0 0; padding: 15px; margin-top: auto; box-sizing: border-box; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); margin-bottom: 8px; padding: 8px 15px; border-radius: 10px; }
        
        .btn { border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-buy { background: #2ecc71; color: white; }
        .btn-sell { background: var(--gold); color: black; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="coin-box">💰 <span id="balance">100</span> FAM</div>
        <div>🚜 Ferma Darajasi: 1</div>
    </div>

    <div class="farm-grid" id="farm-grid">
        </div>

    <div class="shop-menu">
        <h3 style="margin: 0 0 10px 0; color: var(--gold); text-align: center;">🛒 BOZOR</h3>
        <div class="shop-item">
            <span>🐔 Tovuq (10 FAM)</span>
            <button class="btn btn-buy" onclick="buyAnimal('chicken', 10)">SOTIB OLISH</button>
        </div>
        <div class="shop-item">
            <span>🐑 Qo'y (150 FAM)</span>
            <button class="btn btn-buy" onclick="buyAnimal('sheep', 150)">SOTIB OLISH</button>
        </div>
        <button class="btn btn-sell" onclick="sellAll()">Hamma mahsulotni sotish 🥚🧶🥛</button>
        <button class="btn" onclick="saveGame()" style="width: 100%; margin-top: 5px; background: #e74c3c; color: white;">💾 SAQLASH</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let farmData = {
            balance: 100,
            animals: [],
            warehouse: { eggs: 0, wool: 0, milk: 0 }
        };

        function buyAnimal(type, price) {
            if (farmData.balance >= price) {
                farmData.balance -= price;
                farmData.animals.push({ type: type, ready: false, lastProduced: Date.now() });
                renderFarm();
                updateUI();
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                tg.showAlert("Mablag' yetarli emas!");
            }
        }

        function renderFarm() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            farmData.animals.forEach((animal, index) => {
                const slot = document.createElement('div');
                slot.className = 'animal-slot';
                const icon = animal.type === 'chicken' ? '🐔' : (animal.type === 'sheep' ? '🐑' : '🐄');
                slot.innerHTML = `
                    <div style="font-size: 40px;">${icon}</div>
                    <div style="font-size: 10px;">${animal.type.toUpperCase()}</div>
                    <div id="badge-${index}" class="product-badge">!</div>
                `;
                slot.onclick = () => collectProduct(index);
                grid.appendChild(slot);
            });
        }

        // Mahsulot tayyor bo'lishini tekshirish (Hay Day kabi vaqtli)
        setInterval(() => {
            farmData.animals.forEach((animal, index) => {
                let cooldown = animal.type === 'chicken' ? 10000 : 30000; // Tovuq 10sek, Qo'y 30sek
                if (!animal.ready && (Date.now() - animal.lastProduced > cooldown)) {
                    animal.ready = true;
                    document.getElementById(`badge-${index}`).style.display = 'block';
                }
            });
        }, 1000);

        function collectProduct(index) {
            let animal = farmData.animals[index];
            if (animal.ready) {
                if (animal.type === 'chicken') farmData.warehouse.eggs++;
                if (animal.type === 'sheep') farmData.warehouse.wool++;
                animal.ready = false;
                animal.lastProduced = Date.now();
                document.getElementById(`badge-${index}`).style.display = 'none';
                tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        }

        function sellAll() {
            let profit = (farmData.warehouse.eggs * 1) + (farmData.warehouse.wool * 25);
            if (profit > 0) {
                farmData.balance += profit;
                farmData.warehouse = { eggs: 0, wool: 0, milk: 0 };
                updateUI();
                tg.showAlert(`Bozorda hamma narsa sotildi! +${profit} FAM ishlandingiz.`);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = farmData.balance;
        }

        function saveGame() {
            let invString = `C:${farmData.animals.filter(a => a.type === 'chicken').length},S:${farmData.animals.filter(a => a.type === 'sheep').length}`;
            tg.sendData(JSON.stringify({
                action: "update_farm",
                balance: farmData.balance,
                inventory: invString
            }));
        }
    </script>
</body>
</html>
