<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Farm Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --grass-dark: #388e3c;
            --grass-light: #66bb6a;
            --wood: #5d4037;
            --sky: #29b6f6;
            --warning: #e74c3c;
        }
        body {
            margin: 0; padding: 10px;
            /* Realistik maysa effekti */
            background-color: var(--grass-dark);
            background-image: radial-gradient(var(--grass-light) 15%, transparent 16%),
                              radial-gradient(var(--grass-light) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; user-select: none;
            overflow-x: hidden;
            padding-bottom: 240px;
        }

        /* HEADER: Yog'och teksturasi */
        .header {
            background: #4e342e;
            border: 4px solid #3e2723;
            border-radius: 12px;
            padding: 10px;
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 100;
        }
        .stats-col { text-align: left; }
        .coin { color: #f1c40f; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 0 #000; }
        .food { color: #e67e22; font-weight: bold; font-size: 14px; margin-top: 5px; }
        .warehouse { font-size: 12px; text-align: right; line-height: 1.4; color: #ecf0f1; }

        /* OGOHLANTIRISH */
        .alert-box {
            background: rgba(231, 76, 60, 0.9);
            color: white; padding: 5px; border-radius: 5px;
            text-align: center; font-size: 12px; font-weight: bold;
            display: none; margin-bottom: 10px;
            animation: pulse 1s infinite;
        }

        /* GRID */
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .card {
            background: linear-gradient(to bottom, #fff8e1, #ffe0b2);
            border-radius: 10px; padding: 8px 4px; text-align: center;
            border-bottom: 6px solid #d4a76a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        /* Hayvon uxlayotgan yoki och bo'lsa xira bo'ladi */
        .card.hungry { filter: grayscale(100%); opacity: 0.7; border-color: #555; }
        
        .icon { font-size: 32px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2)); transition: 0.2s; }
        .card.hungry .icon { transform: scale(0.8); }

        /* Progress Bar */
        .progress-container {
            width: 90%; height: 6px; background: #555;
            border-radius: 3px; margin: 8px auto 0; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #2ecc71;
            box-shadow: 0 0 5px #2ecc71;
            transition: width 0.1s linear;
        }

        /* SHOP */
        .shop {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #3e2723; border-radius: 20px 20px 0 0;
            padding: 15px; border-top: 5px solid #8d6e63;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6); z-index: 1000;
        }
        .shop-title { font-size: 12px; color: #d7ccc8; margin-bottom: 5px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .shop-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        
        .btn {
            border: none; padding: 10px 4px; border-radius: 8px;
            font-weight: bold; font-size: 11px; cursor: pointer; position: relative;
            color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px); }

        .buy-animal { background: #27ae60; border-bottom: 3px solid #1e8449; }
        .buy-food { background: #e67e22; border-bottom: 3px solid #d35400; grid-column: span 3; }
        .sell { background: #f1c40f; color: #3e2723; border-bottom: 3px solid #f39c12; width: 100%; margin-top: 5px; font-size: 14px;}
        .save { background: #3498db; border-bottom: 3px solid #2980b9; width: 100%; margin-top: 8px; }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        @keyframes eat { 0% { transform: scale(1); } 50% { transform: scale(1.1) rotate(5deg); } 100% { transform: scale(1); } }
        .eating { animation: eat 0.3s ease; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats-col">
            <div class="coin">💰 <span id="balance">0</span></div>
            <div class="food">🌾 Yem: <span id="food">0</span></div>
        </div>
        <div class="warehouse" id="warehouse">🥚0<br>🧶0<br>🥩0</div>
    </div>

    <div class="alert-box" id="alert">⚠️ HAYVONLAR OCH! YEM SOTIB OLING!</div>

    <div class="farm-grid" id="farm"></div>

    <div class="shop">
        <div class="shop-title">Do'kon</div>
        <div class="shop-row">
            <button class="btn buy-animal" onclick="buyAnimal('chicken', 10)">🐔 10<br><small>3s / 1 yem</small></button>
            <button class="btn buy-animal" onclick="buyAnimal('sheep', 150)">🐑 150<br><small>5s / 2 yem</small></button>
            <button class="btn buy-animal" onclick="buyAnimal('cow', 500)">🐄 500<br><small>8s / 3 yem</small></button>
        </div>
        <div class="shop-row">
            <button class="btn buy-food" onclick="buyFood()">🌾 5 YEM SOTIB OLISH (2 FAM)</button>
        </div>
        <button class="btn sell" onclick="sellAll()">HOSILNI SOTISH 💰</button>
        <button class="btn save" onclick="saveGame()">SAQLASH 💾</button>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const urlParams = new URLSearchParams(window.location.search);

// --- O'YIN SOZLAMALARI ---
const CONFIG = {
    chicken: { time: 3, food: 1 }, // 3 sekundda 1 tuxum, 1 yem yeydi
    sheep:   { time: 5, food: 2 }, // 5 sekundda 1 jun, 2 yem yeydi
    cow:     { time: 8, food: 3 }  // 8 sekundda 1 sut, 3 yem yeydi
};

// --- MA'LUMOTLARNI YUKLASH ---
let game = {
    balance: parseInt(urlParams.get('b')) || 10,
    // Agar yem bo'lmasa, 5 ta bonus yem beramiz
    food: parseInt(urlParams.get('f')) || 5, 
    inventory: parseInventory(urlParams.get('i')),
    warehouse: parseWarehouse(urlParams.get('w'))
};

// Parserlar
function parseInventory(str) {
    if (!str) return {};
    let inv = {};
    str.split(',').forEach(item => {
        let [type, count] = item.split(':');
        if (type && count) inv[type] = parseInt(count);
    });
    return inv;
}
function parseWarehouse(str) {
    if (!str) return {eggs: 0, wool: 0, meat: 0};
    let wh = {eggs: 0, wool: 0, meat: 0};
    str.split(',').forEach(p => {
        if(p.includes(':')) {
            let [k, v] = p.split(':');
            if(k === 'E' || k === 'eggs') wh.eggs = parseInt(v);
            if(k === 'W' || k === 'wool') wh.wool = parseInt(v);
            if(k === 'M' || k === 'meat') wh.meat = parseInt(v);
        }
    });
    return wh;
}

// --- LOGIKA VA TAYMERLAR ---
let animalTimers = [];

function updateUI() {
    document.getElementById("balance").innerText = Math.floor(game.balance);
    document.getElementById("food").innerText = game.food;
    document.getElementById("warehouse").innerHTML = 
        `🥚 ${game.warehouse.eggs}<br>🧶 ${game.warehouse.wool}<br>🥩 ${game.warehouse.meat}`;
    
    // Ogohlantirish: Agar yem tugasa va hayvonlar bo'lsa
    const hasAnimals = Object.values(game.inventory).some(c => c > 0);
    const alertBox = document.getElementById("alert");
    if (game.food <= 0 && hasAnimals) {
        alertBox.style.display = "block";
    } else {
        alertBox.style.display = "none";
    }
}

function renderFarm() {
    const farm = document.getElementById("farm");
    farm.innerHTML = "";
    animalTimers = [];

    for (const type in game.inventory) {
        for (let i = 0; i < game.inventory[type]; i++) {
            createAnimalCard(type, i);
        }
    }
}

function createAnimalCard(type, index) {
    const farm = document.getElementById("farm");
    const card = document.createElement("div");
    card.className = "card";
    const barId = `bar-${type}-${index}`;
    const iconId = `icon-${type}-${index}`;
    
    card.innerHTML = `
        <div class="icon" id="${iconId}">${getIcon(type)}</div>
        <div class="progress-container">
            <div class="progress-fill" id="${barId}"></div>
        </div>
    `;
    farm.appendChild(card);

    animalTimers.push({
        id: barId,
        iconId: iconId,
        type: type,
        progress: Math.random() * 50,
        speed: 100 / (CONFIG[type].time * 10)
    });
}

function getIcon(type) {
    return type === 'chicken' ? '🐔' : (type === 'sheep' ? '🐑' : '🐄');
}

// --- GAME LOOP ---
setInterval(() => {
    animalTimers.forEach(animal => {
        // 1. Agar yem bo'lsa, hayvon o'sadi
        if (game.food > 0) {
            animal.progress += animal.speed;
            
            // UI ni normallashtirish
            const card = document.getElementById(animal.id).parentElement.parentElement;
            if(card) card.classList.remove("hungry");
        } else {
            // Yem bo'lmasa, hayvon to'xtaydi va "och" bo'ladi
            const card = document.getElementById(animal.id).parentElement.parentElement;
            if(card) card.classList.add("hungry");
        }

        // 2. Hosil tayyor bo'lsa
        if (animal.progress >= 100) {
            // Yem iste'mol qilish
            let cost = CONFIG[animal.type].food;
            
            if (game.food >= cost) {
                game.food -= cost; // Yemni kamaytirish
                animal.progress = 0;
                produceItem(animal.type);
                
                // Animatsiya
                const icon = document.getElementById(animal.iconId);
                if(icon) {
                    icon.classList.add('eating');
                    setTimeout(() => icon.classList.remove('eating'), 300);
                }
            } else {
                // Yem yetmasa, 99% da qotib turadi
                animal.progress = 99;
                game.food = 0; // xavfsizlik uchun
                updateUI(); // Alertni chiqarish uchun
            }
        }

        // 3. Grafikani chizish
        const barElement = document.getElementById(animal.id);
        if (barElement) {
            barElement.style.width = animal.progress + "%";
        }
    });
}, 100);

function produceItem(type) {
    if (type === 'chicken') game.warehouse.eggs++;
    else if (type === 'sheep') game.warehouse.wool++;
    else if (type === 'cow') game.warehouse.meat++;
    updateUI();
}

// --- ACTIONS ---
function buyAnimal(type, price) {
    if (game.balance >= price) {
        game.balance -= price;
        game.inventory[type] = (game.inventory[type] || 0) + 1;
        updateUI();
        createAnimalCard(type, (game.inventory[type] - 1));
        tg.HapticFeedback.impactOccurred('medium');
    } else {
        tg.showAlert("Mablag' yetarli emas!");
    }
}

function buyFood() {
    // 5 ta yem = 2 FAM
    if (game.balance >= 2) {
        game.balance -= 2;
        game.food += 5;
        updateUI();
        tg.HapticFeedback.impactOccurred('light');
    } else {
        tg.showAlert("Yem olishga pulingiz yo'q! (Narxi: 2 FAM)");
    }
}

function sellAll() {
    let income = (game.warehouse.eggs * 2) + (game.warehouse.wool * 30) + (game.warehouse.meat * 100);
    if (income > 0) {
        game.balance += income;
        game.warehouse = {eggs: 0, wool: 0, meat: 0};
        updateUI();
        tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert(`Sotildi! +${income} FAM`);
    } else {
        tg.showAlert("Ombor bo'sh!");
    }
}

function saveGame() {
    let invStr = Object.entries(game.inventory).map(([k,v]) => `${k}:${v}`).join(',');
    let warStr = `E:${game.warehouse.eggs},W:${game.warehouse.wool},M:${game.warehouse.meat}`;
    
    tg.sendData(JSON.stringify({
        balance: game.balance,
        inventory: invStr,
        warehouse: warStr,
        food: game.food // Yemni ham saqlaymiz!
    }));
}

// Start
updateUI();
renderFarm();
</script>
</body>
</html>
