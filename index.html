<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hay Day: FAM Farm v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --grass: linear-gradient(135deg, #7cfc00, #32cd32);
            --dirt: #8d6e63; --gold: #f1c40f; --wood: #5d4037; --white: #ffffff; 
        }
        body { 
            background: var(--grass); color: white; font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden; user-select: none;
        }

        /* Premium Header */
        .header { 
            width: 95%; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 20px; 
            display: flex; justify-content: space-between; border: 3px solid var(--gold); 
            box-sizing: border-box; position: sticky; top: 5px; z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .coin-display { font-size: 20px; font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 5px; }

        /* Farm Grid & Cards */
        .farm-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            width: 100%; margin-top: 25px; padding-bottom: 260px; 
        }
        .card { 
            background: #fdf5e6; border-radius: 25px; padding: 15px; text-align: center; 
            position: relative; border: 4px solid var(--wood); color: #3e2723;
            box-shadow: 0 6px 0 #3e2723; transition: 0.1s;
        }
        .card:active { transform: translateY(3px); box-shadow: 0 3px 0 #3e2723; }
        .card .icon { font-size: 50px; }

        /* UX: Progress Bar */
        .progress-box { 
            width: 100%; height: 10px; background: #d7ccc8; border-radius: 10px; 
            margin-top: 10px; overflow: hidden; border: 1px solid #5d4037; 
        }
        .progress-fill { 
            height: 100%; background: #4caf50; width: 0%; 
            transition: width 1s linear; 
        }

        /* Product Notification */
        .product-badge { 
            position: absolute; top: -10px; right: -10px; background: #e74c3c; 
            color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; 
            border: 2px solid white; animation: bounce 1s infinite; display: none;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* Styled Shop Menu */
        .shop-menu { 
            position: fixed; bottom: 0; width: 100%; background: #3e2723; 
            border-radius: 30px 30px 0 0; padding: 20px; box-sizing: border-box; 
            border-top: 5px solid var(--gold); z-index: 10;
        }
        .shop-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn { 
            border: none; padding: 12px; border-radius: 12px; font-weight: bold; 
            cursor: pointer; font-size: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn-buy { background: #2ecc71; color: white; }
        .btn-stars { background: #3498db; color: white; width: 100%; margin-bottom: 10px; font-size: 16px; }
        .btn-action { background: var(--gold); color: #3e2723; }
    </style>
</head>
<body>

    <div class="header">
        <div class="coin-display">💰 <span id="balance">100</span></div>
        <div id="warehouse-status" style="font-size: 14px;">🥚:0 | 🧶:0 | 🥩:0</div>
    </div>

    <div class="farm-grid" id="farm-grid"></div>

    <div class="shop-menu">
        <div class="shop-row">
            <button class="btn btn-buy" onclick="buyAnimal('chicken', 10)">🐔 10</button>
            <button class="btn btn-buy" onclick="buyAnimal('sheep', 150)">🐑 150</button>
            <button class="btn btn-buy" onclick="buyAnimal('cow', 500)">🐄 500</button>
        </div>
        <button class="btn btn-stars" onclick="buyWithStars()">⭐ 1000 FAM SOTIB OLISH</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-action" onclick="sellAll()">SOTISH 💰</button>
            <button class="btn btn-action" style="background: #e74c3c; color: white;" onclick="saveGame()">💾 SAQLASH</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let farmData = { balance: 100, animals: [], warehouse: { eggs: 0, wool: 0, meat: 0 } };

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('b')) farmData.balance = parseInt(params.get('b'));
            if(params.get('i')) {
                params.get('i').split(',').forEach(p => {
                    if(!p.includes(':')) return;
                    let [t, c] = p.split(':');
                    let type = (t==='C')?'chicken':(t==='S')?'sheep':'cow';
                    for(let i=0; i<parseInt(c); i++) farmData.animals.push({type: type, ready: false, last: Date.now()});
                });
            }
            if(params.get('w')) {
                params.get('w').split(',').forEach(p => {
                    if(!p.includes(':')) return;
                    let [t, c] = p.split(':');
                    if(t==='E') farmData.warehouse.eggs = parseInt(c);
                    if(t==='W') farmData.warehouse.wool = parseInt(c);
                    if(t==='M') farmData.warehouse.meat = parseInt(c);
                });
            }
            updateUI(); renderFarm();
        };

        function buyAnimal(type, price) {
            if (farmData.balance >= price) {
                farmData.balance -= price;
                farmData.animals.push({ type: type, ready: false, last: Date.now() });
                updateUI(); renderFarm(); 
                tg.HapticFeedback.impactOccurred('medium');
            } else { tg.showAlert("Mablag' yetarli emas!"); }
        }

        function renderFarm() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            farmData.animals.forEach((a, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                let icon = a.type==='chicken'?'🐔':a.type==='sheep'?'🐑':'🐄';
                card.innerHTML = `
                    <div class="icon">${icon}</div>
                    <div class="progress-box"><div id="p-${i}" class="progress-fill"></div></div>
                    <div id="badge-${i}" class="product-badge">!</div>
                `;
                card.onclick = () => collect(i);
                grid.appendChild(card);
            });
        }

        // UX: Progress Barni yangilab boruvchi taymer
        setInterval(() => {
            farmData.animals.forEach((a, i) => {
                let cooldown = a.type==='chicken'?15000:a.type==='sheep'?45000:90000;
                let elapsed = Date.now() - a.last;
                let percent = Math.min((elapsed / cooldown) * 100, 100);
                
                let fill = document.getElementById(`p-${i}`);
                if(fill) fill.style.width = percent + "%";

                if(!a.ready && elapsed >= cooldown) {
                    a.ready = true;
                    let b = document.getElementById(`badge-${i}`);
                    if(b) b.style.display = 'block';
                }
            });
        }, 1000);

        function collect(i) {
            let a = farmData.animals[i];
            if(a.ready) {
                if(a.type==='chicken') farmData.warehouse.eggs++;
                else if(a.type==='sheep') farmData.warehouse.wool++;
                else farmData.warehouse.meat++;
                a.ready = false; a.last = Date.now();
                document.getElementById(`badge-${i}`).style.display = 'none';
                updateUI(); tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function sellAll() {
            let profit = (farmData.warehouse.eggs*2) + (farmData.warehouse.wool*40) + (farmData.warehouse.meat*100);
            if(profit > 0) {
                farmData.balance += profit;
                farmData.warehouse = {eggs:0, wool:0, meat:0};
                updateUI(); tg.showAlert(`Sotildi: +${profit} FAM 💰`);
                tg.HapticFeedback.impactOccurred('heavy');
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(farmData.balance);
            document.getElementById('warehouse-status').innerText = `🥚:${farmData.warehouse.eggs}|🧶:${farmData.warehouse.wool}|🥩:${farmData.warehouse.meat}`;
        }

        function buyWithStars() {
            tg.sendData(JSON.stringify({action: "stars_purchase", amount: 1000}));
            tg.close();
        }

        function saveGame() {
            let c = farmData.animals.filter(a=>a.type==='chicken').length;
            let s = farmData.animals.filter(a=>a.type==='sheep').length;
            let w = farmData.animals.filter(a=>a.type==='cow').length;
            let inv = `C:${c},S:${s},W:${w}`;
            let ware = `E:${farmData.warehouse.eggs},W:${farmData.warehouse.wool},M:${farmData.warehouse.meat}`;
            tg.sendData(JSON.stringify({balance: farmData.balance, inventory: inv, warehouse: ware}));
            tg.close();
        }
    </script>
</body>
</html>
