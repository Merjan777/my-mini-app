<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hay Day: FAM Farm</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --grass: linear-gradient(135deg, #7cfc00, #32cd32);
            --gold: #f1c40f;
            --wood: #5d4037;
        }

        body {
            margin: 0;
            padding: 10px;
            background: var(--grass);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            user-select: none;
        }

        .header {
            background: rgba(0,0,0,0.7);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .coin {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
        }

        .warehouse {
            font-size: 14px;
        }

        .farm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 220px;
        }

        .card {
            background: #fdf5e6;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            border: 4px solid var(--wood);
            color: #3e2723;
            box-shadow: 0 6px 0 #3e2723;
        }

        .card:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #3e2723;
        }

        .icon {
            font-size: 50px;
        }

        .shop {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #3e2723;
            border-radius: 30px 30px 0 0;
            padding: 20px;
            border-top: 5px solid var(--gold);
        }

        .shop-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy { background: #2ecc71; color: white; }
        .sell { background: var(--gold); color: #3e2723; }
        .stars { background: #3498db; color: white; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="coin">💰 <span id="balance">0</span></div>
        <div class="warehouse" id="warehouse">🥚0 | 🧶0 | 🥩0</div>
    </div>

    <!-- FARM -->
    <div class="farm-grid" id="farm"></div>

    <!-- SHOP -->
    <div class="shop">
        <div class="shop-row">
            <button class="btn buy" onclick="buyAnimal('chicken')">🐔 10</button>
            <button class="btn buy" onclick="buyAnimal('sheep')">🐑 150</button>
            <button class="btn buy" onclick="buyAnimal('cow')">🐄 500</button>
        </div>

        <button class="btn stars" onclick="buyStars()">⭐ 1000 FAM</button>

        <button class="btn sell" onclick="sellAll()">SOTISH 💰</button>
    </div>

<script>
/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

/* ================= GAME STATE ================= */
let game = {
    balance: 0,
    inventory: {},
    warehouse: {}
};

/* ================= LOAD GAME ================= */
tg.sendData(JSON.stringify({ action: "load_game" }));

/* ================= RECEIVE FROM SERVER ================= */
tg.onEvent("message", (event) => {
    try {
        const data = JSON.parse(event.data);
        if (data.balance !== undefined) {
            game.balance = data.balance;
            game.inventory = data.inventory || {};
            game.warehouse = data.warehouse || {};
            updateUI();
            renderFarm();
        }
    } catch {}
});

/* ================= UI ================= */
function updateUI() {
    document.getElementById("balance").innerText = game.balance;
    document.getElementById("warehouse").innerText =
        `🥚${game.warehouse.eggs || 0} | 🧶${game.warehouse.wool || 0} | 🥩${game.warehouse.meat || 0}`;
}

/* ================= FARM RENDER ================= */
function renderFarm() {
    const farm = document.getElementById("farm");
    farm.innerHTML = "";

    for (const type in game.inventory) {
        for (let i = 0; i < game.inventory[type]; i++) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="icon">${icon(type)}</div>`;
            card.onclick = () => collect(type);
            farm.appendChild(card);
        }
    }
}

function icon(type) {
    if (type === "chicken") return "🐔";
    if (type === "sheep") return "🐑";
    if (type === "cow") return "🐄";
    return "❓";
}

/* ================= ACTIONS ================= */
function buyAnimal(type) {
    tg.sendData(JSON.stringify({
        action: "buy_animal",
        animal: type
    }));
}

function collect(type) {
    tg.sendData(JSON.stringify({
        action: "collect_product",
        animal: type
    }));
}

function sellAll() {
    tg.sendData(JSON.stringify({
        action: "sell_all"
    }));
}

function buyStars() {
    tg.sendData(JSON.stringify({
        action: "stars_purchase"
    }));
    tg.close();
}
</script>

</body>
</html>
