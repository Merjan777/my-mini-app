<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Ferma</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="header-item">💰 <span id="balance" style="color:#ffd700">0</span></div>
            <div class="header-item">🌾 <span id="food" style="color:#ffab40">0</span></div>
            <div onclick="saveGame()" style="cursor: pointer; background: #66bb6a; padding: 5px 10px; border-radius: 8px; border-bottom: 3px solid #388e3c; color: white;">
                💾
            </div>
        </div>
        
        <div>
            <div class="xp-container">
                <div class="xp-fill" id="xp-bar"></div>
            </div>
            <div class="level-text">LEVEL <span id="level">1</span> (<span id="xp">0</span> XP)</div>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">🥚 <span id="stat-egg">0</span></div>
        <div class="stat-item">🧶 <span id="stat-wool">0</span></div>
        <div class="stat-item">🥩 <span id="stat-meat">0</span></div>
    </div>

    <div id="map-view">
        <h3 class="map-title">FERMA XARITASI 🗺</h3>
        <div class="map-grid">
            <div class="building" onclick="openBuilding('chicken')">
                <span class="b-icon">🛖</span>
                <div class="b-name">Tovuqxona</div>
                <div class="b-count" id="count-chicken">0</div>
            </div>
            <div class="building" onclick="openBuilding('sheep')">
                <span class="b-icon">🏚</span>
                <div class="b-name">Qo'yxona</div>
                <div class="b-count" id="count-sheep">0</div>
            </div>
            <div class="building" onclick="openBuilding('cow')">
                <span class="b-icon">🏠</span>
                <div class="b-name">Molxona</div>
                <div class="b-count" id="count-cow">0</div>
            </div>
            <div class="building" onclick="openShop()">
                <span class="b-icon">🏪</span>
                <div class="b-name">Bozor & Yem</div>
            </div>
        </div>
    </div>

    <div id="interior-view">
        <button class="back-btn" onclick="showMap()">⬅️ Xaritaga qaytish</button>
        <h3 id="room-title" class="map-title">Xona</h3>
        <div class="farm-grid" id="farm-grid"></div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="openShop()">🛒 Do'kon</button>
        <button class="ctrl-btn ctrl-save" onclick="sellAll()">💰 Sotish</button>
    </div>

    <div id="shop-modal">
        <h3 style="text-align: center; margin-top: 0; font-size: 24px;">Fermer Do'koni</h3>
        <div class="shop-row">
            <button class="btn-buy-anim" onclick="buyAnimal('chicken', 10)">
                <div>🐔 Tovuq</div> <span>10 💰</span>
            </button>
            <button class="btn-buy-anim" onclick="buyAnimal('sheep', 150)">
                <div>🐑 Qo'y (Lvl 3)</div> <span>150 💰</span>
            </button>
            <button class="btn-buy-anim" onclick="buyAnimal('cow', 500)">
                <div>🐄 Sigir (Lvl 5)</div> <span>500 💰</span>
            </button>
            <hr style="border-color: #5d4037;">
            <button class="btn-buy-food" onclick="buyFood()">
                <div>🌾 5 ta YEM</div> <span>2 💰</span>
            </button>
            
            <button class="btn-donate" onclick="buyRealMoney()">
                <div>⭐ 1000 FAM + 10 YEM</div> <span>50 Stars</span>
            </button>

            <button class="shop-row close-shop" onclick="closeShop()">Yopish ❌</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
